name: Deploy Webizen Studio to GitHub Pages

on:
  push:
    branches: [main, 0.0.1-dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sparse-clone qualiaDB (qualia-core-db path dep)
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/mediaprophet/qualiaDB.git \
            "$GITHUB_WORKSPACE/../qualiaDB"
          cd "$GITHUB_WORKSPACE/../qualiaDB"
          git sparse-checkout set crates/qualia-core-db
          git checkout

      - name: Install Rust (stable + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('webizen-studio/Cargo.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked

      - name: Build for web (wasm32)
        working-directory: webizen-studio
        run: dx build --release

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webizen-studio/target/dx/webizen-studio/release/web/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
